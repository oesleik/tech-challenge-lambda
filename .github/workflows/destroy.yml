name: Destroy

# Manual. Primeiro da cadeia de destroy: lambda -> app -> infra-db -> infra-k8s.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite exatamente destroy para confirmar"
        required: true
        type: string

concurrency:
  group: lambda
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  TF_STATE_KEY: tech-challenge/lambda.tfstate

jobs:
  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require master branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "Rode este workflow com a branch master selecionada."
            exit 1
          fi

      - name: Confirm destroy
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "Abortado: o campo confirm precisa ser exatamente: destroy"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # O archive_file é lido também no destroy: build/ precisa existir.
      - name: Build package
        run: |
          npm ci
          npm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      # As preconditions exigem os secrets mesmo no destroy. As ENIs da Lambda na VPC levam
      # alguns minutos para sumir; o provider espera.
      - name: Terraform destroy
        working-directory: terraform
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_lambda_db_password: ${{ secrets.LAMBDA_DB_PASSWORD }}
        run: terraform destroy -auto-approve -var-file=env/aws.tfvars
